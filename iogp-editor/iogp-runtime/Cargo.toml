[package]
name = "iogp-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Inference-time evaluator for compiled IOGP alert rules (config.json from iogp-editor). No parser, no Prolog, no solver: serde only. Rust API and C ABI."
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
